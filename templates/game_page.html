<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — Pixel Golf</title>
  <link rel="stylesheet" href="/assets/style.css?v=5">
</head>
<body>
  {% include "nav.html" %}
  <div class="game-container" id="game-page"
       data-terrain='{{ terrain_json }}'
       data-hole-id="{{ hole_id }}"
       data-allow-save="{% if allow_save %}true{% else %}false{% endif %}"
       data-user-logged-in="{% if user_logged_in %}true{% else %}false{% endif %}">
    <div class="content-wrapper">
      <div class="map-container map-wrapper" id="game-map-container">
        <div id="game-map-svg-host"></div>
        <div class="overlay" id="win-overlay" hidden aria-hidden="true">
          <h1>Congratulations!</h1>
          <p class="stroke-count" id="stroke-count"></p>
          {% if user_logged_in %}
          <button class="save-btn" id="save-play-btn" type="button">Save Play</button>
          <p class="saved-msg" id="saved-msg" hidden>Play saved!</p>
          <p class="save-error" id="save-error" hidden></p>
          {% endif %}
        </div>
      </div>
      <div class="controls-container" id="game-controls">
        <div class="controls-primary">
          <div class="dice-container">
            <svg class="dice" id="dice" width="100" height="100" viewBox="0 0 100 100" role="button" tabindex="0" aria-label="Roll dice">
              <rect id="dice-rect" class="D8" x="10" y="10" width="80" height="80" rx="10"/>
              <g id="dice-dots"></g>
            </svg>
            <button class="putt-button" id="putt-btn" type="button">Putt</button>
            <p class="no-moves" id="no-moves" hidden>No moves! Roll again.</p>
          </div>
          <div class="main-info">
            <p>Par: <span id="info-par">{{ terrain.par }}</span></p>
            <p>Strokes: <span id="info-strokes">0</span></p>
            <p>Dist: <span id="info-dist">{{ dist }}</span></p>
          </div>
          <button type="button" class="game-more-toggle mobile-only" id="game-more-toggle" aria-expanded="false" aria-controls="hole-info-panel" aria-label="Hole options">⋯</button>
        </div>
        <div class="hole-info-panel" id="hole-info-panel">
          <div class="seed-controls">
            <p class="seed-line">Seed: <span id="seed-display">{{ formatted_seed }}</span></p>
            <div class="button-group">
              {% if show_random_button %}<button class="seed-button" id="btn-random" type="button">Random</button>{% endif %}
              <button class="seed-button" id="btn-retry" type="button">Retry</button>
              {% if show_save_button && user_logged_in %}<button class="seed-button" id="btn-save-hole" type="button">Save</button>{% endif %}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/assets/game.js?v=14"></script>
</body>
</html>
